name: Build Android APK
# Signed APK release; signing material is supplied only via GitHub Actions secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SIGNING_KEY_B64: ${{ secrets.ARSHIN_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.ARSHIN_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify persistent signing configuration
        shell: bash
        run: |
          if [[ -z "$SIGNING_KEY_B64" || -z "$SIGNING_PASSWORD" ]]; then
            echo "::error::Set ARSHIN_KEYSTORE_BASE64 and ARSHIN_KEYSTORE_PASSWORD in repository Actions secrets before publishing updates."
            exit 1
          fi
          echo "Signing configuration found."
      - name: Decode permanent signing key
        shell: bash
        run: |
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/arshinscreen.p12"
          chmod 600 "$RUNNER_TEMP/arshinscreen.p12"
          keytool -list -keystore "$RUNNER_TEMP/arshinscreen.p12" -storetype PKCS12 -storepass "$SIGNING_PASSWORD" -alias arshinscreen >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed release APK
        env:
          ARSHIN_KEYSTORE_PATH: ${{ runner.temp }}/arshinscreen.p12
          ARSHIN_KEYSTORE_PASSWORD: ${{ secrets.ARSHIN_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signing certificate
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Prepare APK named with version
        shell: bash
        run: |
          VERSION=$(awk -F"'" '/versionName/{print $2; exit}' app/build.gradle)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "MetodikiSI_v${VERSION}.apk"
      - name: Publish signed APK as direct download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "android-build-${{ github.run_number }}" "MetodikiSI_v${APP_VERSION}.apk" --title "Методики СИ — версия ${APP_VERSION}, сборка ${{ github.run_number }}" --notes "Подписанный APK. Последующие выпуски с тем же ключом обновляются поверх установленной версии." --latest
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetodikiSI-versioned-apk
          path: MetodikiSI_v*.apk
          if-no-files-found: error
