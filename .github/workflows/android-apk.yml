name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}" || (echo "Android SDK is unavailable" && exit 1)
          command -v sdkmanager || true
          ls "${ANDROID_HOME}/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArshinScreen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
