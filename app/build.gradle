plugins { id 'com.android.application' }

def signingFilePath = System.getenv('ARSHIN_KEYSTORE_PATH')
def signingPassword = System.getenv('ARSHIN_KEYSTORE_PASSWORD')
def hasSigning = signingFilePath && signingPassword

android {
    namespace 'ru.arshinscreen.app'
    compileSdk 35

    defaultConfig {
        // Never change applicationId: Android relies on it to update an installed app.
        applicationId 'ru.arshinscreen.app'
        minSdk 26
        targetSdk 34
        // CI run number increases for each new published build.
        versionCode 1000 + (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0.10'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        stable {
            if (hasSigning) {
                storeFile file(signingFilePath)
                storePassword signingPassword
                keyAlias 'arshinscreen'
                keyPassword signingPassword
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Android-compatible PDF text extraction for documents selected through Storage Access Framework.
dependencies { implementation 'com.tom-roush:pdfbox-android:2.0.27.0' }
